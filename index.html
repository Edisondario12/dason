<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DASON | Iniciar Sesión</title>
        <link href="Css/estilos.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Contenedor de la página para iniciar sesión -->
        <div class="login-card">
            <!-- Encabezado informativo -->
            <div class="login-header">
                <h1>DASON</h1>
                <p>Iniciar sesión · Finanzas personales</p>
            </div>

            <!-- Formulario de inicio de sesión -->
            <form action="html/panel.html" method="GET">
                <!-- Campo de usuario o correo electrónico -->
                <div class="form-group">
                    <label for="username">Usuario o Correo Electrónico</label>
                    <input
                        type="text"
                        id="username"
                        autocomplete="username"
                        required
                        class="form-control"
                        placeholder="Ej: 2021001 o usuario@correo.com"
                    />
                </div>

                <!-- Campo de contraseña -->
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        autocomplete="current-password"
                        required
                        class="form-control"
                        placeholder="Ingrese su contraseña"
                    />
                </div>

                <!-- Opciones para recordar sesión y recuperar clave de acceso -->
                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" />
                        <span>Recordar sesión</span>
                    </label>
                </div>

                <p class="demo-notice">
                    Acceso de demostración: utiliza datos ficticios. No se comprueban ni se envían
                    tus credenciales.
                </p>
                <!-- Botón de inicio de sesión -->
                <button type="submit" class="btn-submit">Iniciar Sesión</button>

                <!-- Pie de página -->
                <footer class="login-footer">
                    <p>
                        ¿Quieres conocer DASON?
                        <a href="html/panel.html">Explorar el panel</a>
                    </p>
                </footer>
            </form>
        </div>
    </body>
</html>
